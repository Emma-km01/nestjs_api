info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/auth/sign-up/email"
  body:
    type: json
    data: |-
      {
        "email": "poule@gmail.com",
        "password": "password123",
        "name": "crevette kobalad"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("token", res.getBody().token);
        bru.setEnvVar("token", res.getBody().token);
    - type: tests
      code: |-
        test("status 200", function(){
          expect(res.getStatus()).to.equal(200)
        });
        test("token present", function(){
          expect(res.getBody().token).to.be.a("string")
        });
        test("email corresponp a la requette", function(){
          const requestBody = req.getBody();
          expect(res.getBody().user.email.to.equal(requestBody.email));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
